name: Deploy Adi & Aru Hot Seat Game to Pages

on:
  push:
    branches:
      - claude/adi-aru-game-show-ozpto8
      - master
    paths:
      - 'adi-aru-hotseat/**'
      - '.github/workflows/deploy-adi-aru-game-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: 'pages-adi-aru-game'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: adi-aru-hotseat

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
